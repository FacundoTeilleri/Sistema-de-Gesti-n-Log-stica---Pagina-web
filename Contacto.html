        }

            justify-content: end;
            display: flex;
            gap: 30px;
            color: white;
            font-size: 1.2em;
            font-family: Arial, Helvetica, sans-serif;
            list-style: none;
            color: rgb(163, 213, 253);
            margin-right: 10px;


        }

        li:hover {
            transform: translateY(-3px);
            transition: 500ms;
        }

        a {
            color: inherit;
            text-decoration: none;

        }

        html {
